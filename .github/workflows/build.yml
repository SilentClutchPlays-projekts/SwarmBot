name: Compile SwarmBot

on:
  workflow_dispatch: # Käivitad käsitsi Actions alt rohelise nupuga

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Tõmba kood GitHubist
      uses: actions/checkout@v4

    - name: Paigalda Rust (v1.75.0)
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.75.0 # See versioon toetab unikaalset koodi ideaalselt

    - name: Jõuga reeglite muutmine (Force Allow)
      run: |
        sed -i 's/#\[deny/#\[allow/g' src/main.rs || true
        sed -i 's/#\!\[deny/#\!\[allow/g' src/main.rs || true
        sed -i 's/deny =/allow =/g' Cargo.toml || true

    - name: Ehita fail (Õige nimega)
      run: |
        # Muutsime nime 'swarmbot-cli' -> 'swarm-bot'
        RUSTFLAGS="-A warnings" cargo build --release --bin swarm-bot

    - name: Laadi valmis fail üles
      uses: actions/upload-artifact@v4
      with:
        name: swarmbot-linux-executable
        path: target/release/swarm-bot
